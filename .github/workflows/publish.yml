# Publishes @ajdev0/token-shrink to npm when a version tag (v1.2.3) is pushed.
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com the
# package's Trusted Publisher must point at this repository and the workflow
# filename `publish.yml`. Provenance is attached automatically.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Build and tests already ran above; skip the prepublishOnly rerun.
      - run: npm publish --access public --ignore-scripts
